name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 --max-line-length 100 app.py test_app.py

      - name: Unit tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t cicd-poc:${{ github.sha }} .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 cicd-poc:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:8080/health
